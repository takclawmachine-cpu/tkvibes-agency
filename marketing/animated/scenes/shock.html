<!DOCTYPE html>
<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Arial Black',Arial,sans-serif;background:radial-gradient(ellipse at 50% 30%,#6C5CE7 0%,#2D3436 70%)}
@keyframes shake{0%,100%{transform:translate(0)}10%{transform:translate(-15px,5px)}20%{transform:translate(15px,-5px)}30%{transform:translate(-10px,8px)}40%{transform:translate(10px,-8px)}50%{transform:translate(-5px,5px)}60%{transform:translate(5px,-5px)}70%{transform:translate(-3px,3px)}80%{transform:translate(3px,-3px)}}
@keyframes pulse{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes slideUp{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes countNum{from{opacity:0;transform:scale(0.5)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

.scene{width:100%;height:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:40px}
.bg-shock{position:absolute;width:100%;height:100%;background:linear-gradient(180deg,#2D3436 0%,#E74C3C 30%,#2D3436 70%)}
.flash{animation:flashBg 2s ease-in-out}
@keyframes flashBg{0%,100%{opacity:0}25%,75%{opacity:0.4}}

/* Big 53% stat */
.stat-53{font-size:200px;font-weight:900;color:#FF6B6B;z-index:2;animation:countNum 0.8s 0.3s both;text-shadow:0 0 100px rgba(255,107,107,0.5)}
.stat-label{font-size:36px;color:#FFEAA7;z-index:2;text-align:center;animation:slideUp 0.6s 0.8s both}
.stat-sub{font-size:28px;color:#BDC3C7;z-index:2;text-align:center;animation:slideUp 0.6s 1.2s both;margin-top:10px}

/* Countdown 3…2…1… */
.countdown-row{display:flex;gap:40px;margin:30px 0;z-index:2;animation:fadeIn 0.5s 1.3s both}
.cd-item{text-align:center}
.cd-num{font-size:60px;font-weight:900;color:#FDCB6E}
.cd-label{font-size:18px;color:#888}

/* Shock text */
.shock-line{font-size:60px;font-weight:900;color:#FFFFFF;z-index:2;text-align:center;line-height:1.3}
.shock-line.red{color:#FF6B6B;animation:shake 0.5s 2.2s 3}
.shock-line.big{font-size:80px;animation:shake 0.5s 2.8s 3}

/* Money flying away */
.money-bg{position:absolute;font-size:40px;opacity:0.08;color:#00FF88;font-weight:900}
.m1{top:10%;left:5%;animation:float 3s infinite}
.m2{top:20%;right:10%;animation:float 4s infinite 1s}
.m3{bottom:15%;left:15%;animation:float 3.5s infinite 0.5s}
.m4{bottom:25%;right:5%;animation:float 4.5s infinite 1.5s}

/* Bottom bar */
.bottom-bar{position:absolute;bottom:60px;display:flex;gap:30px;z-index:2;animation:slideUp 0.8s 3s both}
.bb-item{text-align:center}
.bb-val{font-size:36px;font-weight:900;color:#FDCB6E}
.bb-lbl{font-size:18px;color:#888;margin-top:5px}
</style></head><body>
<div class="scene">
  <div class="bg-shock flash"></div>
  <div class="money-bg m1">$</div><div class="money-bg m2">$</div><div class="money-bg m3">$</div><div class="money-bg m4">$</div>

  <div class="stat-53">53%</div>
  <div class="stat-label">of users leave a website if it takes</div>
  <div class="stat-sub">more than <strong style="color:#FF6B6B;font-size:48px">3 seconds</strong> to load</div>

  <div class="countdown-row">
    <div class="cd-item"><div class="cd-num" style="color:#E74C3C">3</div><div class="cd-label">seconds</div></div>
    <div class="cd-item"><div class="cd-num" style="color:#F39C12">2</div><div class="cd-label">seconds</div></div>
    <div class="cd-item"><div class="cd-num" style="color:#FDCB6E">1</div><div class="cd-label">second</div></div>
    <div class="cd-item"><div class="cd-num" style="color:#FF6B6B">0</div><div class="cd-label">GONE</div></div>
  </div>

  <div class="shock-line red" style="margin-top:40px">YOUR SLOW WEBSITE</div>
  <div class="shock-line big" style="color:#FF6B6B">IS COSTING YOU</div>
  <div class="shock-line big" style="color:#FFFFFF;animation:shake 0.5s 3.4s 3">CUSTOMERS</div>

  <div class="bottom-bar">
    <div class="bb-item"><div class="bb-val">$2.6B</div><div class="bb-lbl">Lost yearly to slow sites</div></div>
    <div class="bb-item"><div class="bb-val">53%</div><div class="bb-lbl">Leave after 3 seconds</div></div>
    <div class="bb-item"><div class="bb-val">70%</div><div class="bb-lbl">Lack mobile sites</div></div>
  </div>
</div>
</body></html>
