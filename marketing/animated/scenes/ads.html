<!DOCTYPE html>
<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#2D3436 0%,#6C5CE7 100%)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes countUp{0%{opacity:0;transform:scale(0.5)}60%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{from{height:0}to{height:var(--h)}}

.scene{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.title{font-size:48px;font-weight:900;color:#FFFFFF;margin-bottom:25px;animation:fadeIn 0.5s 0.1s both;text-align:center}
.title span{color:#FDCB6E}

/* Waste money visual */
@keyframes burn{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.waste-icon{position:absolute;top:10%;right:8%;font-size:60px;opacity:0.08;animation:burn 2s infinite}
.waste-icon2{position:absolute;bottom:15%;left:5%;font-size:50px;opacity:0.06;animation:burn 2.5s infinite 0.5s}

/* Dashboard */
.dash{width:82%;background:#1A1A2E;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:fadeIn 0.5s 0.1s both}
.dhdr{background:#2D2D44;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.dtitle{color:#FFF;font-size:18px;font-weight:700}
.dstatus{color:#00FF88;font-size:12px;background:rgba(0,255,136,0.1);padding:3px 12px;border-radius:20px}

.dbody{padding:18px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mcard{background:rgba(255,255,255,0.04);border-radius:10px;padding:14px;text-align:center;animation:countUp 0.4s both}
.mcard:nth-child(1){animation-delay:0.3s}.mcard:nth-child(2){animation-delay:0.6s}
.mcard:nth-child(3){animation-delay:0.9s}.mcard:nth-child(4){animation-delay:1.2s}
.mval{font-size:30px;font-weight:900}
.mlbl{font-size:13px;color:#888;margin-top:3px}
.mcard.green .mval{color:#00FF88}.mcard.blue .mval{color:#3498DB}
.mcard.yellow .mval{color:#FDCB6E}.mcard.purple .mval{color:#BB86FC}

/* Campaign list */
.camp{background:rgba(255,255,255,0.03);border-radius:8px;padding:10px 14px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.05);animation:slideUp 0.3s both}
.camp:nth-child(1){animation-delay:1s}.camp:nth-child(2){animation-delay:1.3s}.camp:nth-child(3){animation-delay:1.6s}
.cname{color:#FFF;font-size:14px;font-weight:600}
.cs{display:flex;gap:16px}
.csv{font-size:15px;font-weight:700;color:#00FF88;text-align:right}
.csl{font-size:10px;color:#666}

/* Chart */
.cht{display:flex;align-items:flex-end;gap:5px;height:45px;margin-top:10px;padding:0 8px}
.cb{flex:1;background:linear-gradient(to top,#6C5CE7,#00CEC9);border-radius:3px 3px 0 0;width:0;animation:rise 0.5s both}
.cb:nth-child(1){--h:18px;animation-delay:1.8s}.cb:nth-child(2){--h:30px;animation-delay:1.9s}
.cb:nth-child(3){--h:22px;animation-delay:2s}.cb:nth-child(4){--h:38px;animation-delay:2.1s}
.cb:nth-child(5){--h:26px;animation-delay:2.2s}.cb:nth-child(6){--h:42px;animation-delay:2.3s}
.cb:nth-child(7){--h:35px;animation-delay:2.4s}.cb:nth-child(8){--h:40px;animation-delay:2.5s}

/* ROAS badge */
.roas{position:absolute;bottom:20%;right:8%;background:#FDCB6E;color:#2D3436;padding:6px 18px;border-radius:30px;font-weight:900;font-size:28px;z-index:3;animation:countUp 0.6s 2s both;box-shadow:0 4px 30px rgba(253,203,110,0.5)}
</style></head><body>
<div class="scene">
  <div class="waste-icon">&#128176;</div>
  <div class="waste-icon2">&#128200;</div>
  <div class="roas">2.5x ROAS</div>

  <div class="title">Stop Wasting <span>Ad Spend</span></div>

  <div class="dash">
    <div class="dhdr"><div class="dtitle">&#128202; Campaign Dashboard</div><div class="dstatus">&#9679; Optimized</div></div>
    <div class="dbody">
      <div class="mgrid">
        <div class="mcard green"><div class="mval">&#8377;2.4L</div><div class="mlbl">Revenue</div></div>
        <div class="mcard blue"><div class="mval">12.4%</div><div class="mlbl">Conv. Rate</div></div>
        <div class="mcard yellow"><div class="mval">&#8377;48</div><div class="mlbl">Cost/Lead</div></div>
        <div class="mcard purple"><div class="mval">3.2x</div><div class="mlbl">ROAS</div></div>
      </div>

      <div class="camp"><div class="cname">Google Search - Web Design</div><div class="cs"><div><div class="csv">5.2%</div><div class="csl">CTR</div></div><div><div class="csv">48</div><div class="csl">Conv</div></div></div></div>
      <div class="camp"><div class="cname">Instagram - Brand</div><div class="cs"><div><div class="csv">3.8%</div><div class="csl">CTR</div></div><div><div class="csv">126</div><div class="csl">Conv</div></div></div></div>
      <div class="camp"><div class="cname">Facebook - Retarget</div><div class="cs"><div><div class="csv">7.1%</div><div class="csl">CTR</div></div><div><div class="csv">89</div><div class="csl">Conv</div></div></div></div>

      <div class="cht">
        <div class="cb"></div><div class="cb"></div><div class="cb"></div><div class="cb"></div>
        <div class="cb"></div><div class="cb"></div><div class="cb"></div><div class="cb"></div>
      </div>
    </div>
  </div>
</div>
</body></html>
