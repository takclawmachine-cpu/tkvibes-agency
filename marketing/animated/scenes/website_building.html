<!DOCTYPE html>
<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#6C5CE7 0%,#00CEC9 100%)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes buildEl{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fillGauge{from{width:0}to{width:var(--w)}}
@keyframes typing{from{width:0}to{width:100%}}

.scene{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.title{font-size:48px;font-weight:900;color:#FFFFFF;margin-bottom:30px;animation:fadeIn 0.5s 0.1s both;text-align:center}
.title span{color:#FDCB6E}

/* Browser */
.browser{width:80%;background:#1E1E2E;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.4);animation:fadeIn 0.5s 0.3s both}
.bar{background:#2D2D44;padding:12px 16px;display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#FF5F57}.dot.y{background:#FFBD2E}.dot.g{background:#28C840}
.url{background:#1A1A2E;color:#888;font-size:14px;padding:6px 16px;border-radius:8px;flex:1;text-align:center}
.url span{color:#FDCB6E}
.content{padding:24px}
.elem{background:rgba(255,255,255,0.06);border-radius:8px;margin:10px 0;transform-origin:center}
.e-hdr{height:36px;width:100%;animation:buildEl 0.4s 0.5s both;display:flex;align-items:center;padding:0 12px;gap:10px}
.e-hdr .logo{width:50px;height:16px;background:rgba(255,255,255,0.15);border-radius:4px}
.e-hdr .nav{display:flex;gap:12px;margin-left:auto}
.e-hdr .nv{width:40px;height:10px;background:rgba(255,255,255,0.1);border-radius:4px}
.e-hero{height:80px;width:100%;background:linear-gradient(90deg,rgba(108,92,231,0.15),rgba(0,206,201,0.15));animation:buildEl 0.4s 0.9s both;border-radius:10px;display:flex;align-items:center;padding:0 16px;gap:16px}
.e-hero .box{width:50px;height:50px;background:rgba(253,203,110,0.25);border-radius:10px}
.e-hero .lns{flex:1}
.e-hero .ln{height:8px;background:rgba(255,255,255,0.1);border-radius:4px;margin:6px 0}
.e-grid{display:flex;gap:10px;animation:buildEl 0.4s 1.3s both}
.e-grid .c{flex:1;height:50px;background:rgba(255,255,255,0.05);border-radius:8px}
.e-cta{height:40px;width:100%;background:linear-gradient(90deg,rgba(253,203,110,0.15),rgba(253,203,110,0.05));animation:buildEl 0.4s 1.7s both;border-radius:8px;display:flex;align-items:center;justify-content:center}
.e-cta .btn{width:100px;height:24px;background:rgba(253,203,110,0.3);border-radius:20px}

/* Speed gauge */
.gauge-row{display:flex;gap:15px;margin-top:25px;z-index:2;width:80%}
.gauge-item{flex:1;background:rgba(255,255,255,0.08);border-radius:12px;padding:15px;text-align:center;animation:slideUp 0.4s both}
.gauge-item:nth-child(1){animation-delay:1.6s}
.gauge-item:nth-child(2){animation-delay:2s}
.gauge-item:nth-child(3){animation-delay:2.4s}
.gauge-val{font-size:40px;font-weight:900;color:#00FF88}
.gauge-lbl{font-size:18px;color:#BDC3C7;margin-top:5px}
.gauge-track{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin-top:10px;overflow:hidden}
.gauge-fill{height:100%;border-radius:3px;background:#00FF88;width:0;animation:fillGauge 1s 2.5s both}
.gauge-item:nth-child(1) .gauge-fill{--w:95%}
.gauge-item:nth-child(2) .gauge-fill{--w:90%}
.gauge-item:nth-child(3) .gauge-fill{--w:85%}

/* Process flow */
.process{display:flex;gap:8px;margin-top:15px;width:80%;animation:slideUp 0.5s 2.8s both}
.p-step{flex:1;text-align:center;padding:8px;background:rgba(255,255,255,0.05);border-radius:8px}
.p-num{font-size:16px;font-weight:900;color:#FDCB6E}
.p-label{font-size:12px;color:#BDC3C7;margin-top:2px}
</style></head><body>
<div class="scene">
  <div class="title">We Build <span>Stunning Websites</span></div>

  <div class="browser">
    <div class="bar"><div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div><div class="url">&#128274; yourbusiness.<span>tkvibes.in</span></div></div>
    <div class="content">
      <div class="elem e-hdr"><div class="logo"></div><div class="nav"><div class="nv"></div><div class="nv"></div><div class="nv"></div></div></div>
      <div class="elem e-hero"><div class="box"></div><div class="lns"><div class="ln" style="width:80%"></div><div class="ln" style="width:50%"></div></div></div>
      <div class="elem e-grid"><div class="c"></div><div class="c"></div><div class="c"></div></div>
      <div class="elem e-cta"><div class="btn"></div></div>
    </div>
  </div>

  <div class="gauge-row">
    <div class="gauge-item"><div class="gauge-val">&lt;2s</div><div class="gauge-lbl">Load Time</div><div class="gauge-track"><div class="gauge-fill"></div></div></div>
    <div class="gauge-item"><div class="gauge-val">100%</div><div class="gauge-lbl">Mobile Ready</div><div class="gauge-track"><div class="gauge-fill"></div></div></div>
    <div class="gauge-item"><div class="gauge-val">97</div><div class="gauge-lbl">Pagespeed</div><div class="gauge-track"><div class="gauge-fill"></div></div></div>
  </div>

  <div class="process">
    <div class="p-step"><div class="p-num">01</div><div class="p-label">Concept</div></div>
    <div class="p-step"><div class="p-num">02</div><div class="p-label">Design</div></div>
    <div class="p-step"><div class="p-num">03</div><div class="p-label">Develop</div></div>
    <div class="p-step"><div class="p-num">04</div><div class="p-label">Launch</div></div>
  </div>
</div>
</body></html>
