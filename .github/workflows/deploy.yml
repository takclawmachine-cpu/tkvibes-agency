name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site
        run: |
          test -f index.html || (echo "::error::index.html not found" && exit 1)
          test -f assets/css/styles.css || (echo "::error::styles.css not found" && exit 1)
          test -f assets/js/main.js || (echo "::error::main.js not found" && exit 1)
          echo "Static site files OK"

      - name: Install lftp
        run: sudo apt-get install -y -qq lftp

      - name: Create lftp deploy script
        run: |
          cat > /tmp/deploy-lftp.sh << 'LFTP_SCRIPT'
          #!/bin/bash
          set -e
          FTP_USER="${{ secrets.FTP_USER }}"
          FTP_PASS="${{ secrets.FTP_PASS }}"
          FTP_HOST="${{ secrets.FTP_HOST }}"
          
          lftp -u "$FTP_USER","$FTP_PASS" $FTP_HOST << 'LFTP_CMDS'
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data yes
          set ftp:ssl-force yes
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set dns:order inet
          set net:timeout 120
          set net:max-retries 15
          mirror --reverse --verbose --overwrite --ignore-time --no-perms --parallel=3
            --exclude '\.git/'
            --exclude '\.github/'
            --exclude 'scripts/'
            --exclude 'tkvibes-lead-engine/'
            --exclude 'operations-dashboard/'
            --exclude 'local-llm/'
            --exclude 'deliverables/'
            --exclude '\.venv/'
            --exclude '\.next/'
            --exclude 'node_modules/'
            --exclude 'memory/'
            --exclude '\.pyc$'
            --exclude '__pycache__/'
            ./ /public_html/
          bye
          LFTP_CMDS
          LFTP_SCRIPT
          chmod +x /tmp/deploy-lftp.sh

      - name: Deploy to Hostinger
        run: bash /tmp/deploy-lftp.sh
