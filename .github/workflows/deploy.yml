name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site
        run: |
          test -f index.html || (echo "::error::index.html not found" && exit 1)
          test -f assets/css/styles.css || (echo "::error::styles.css not found" && exit 1)
          echo "Static site files OK"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to Hostinger via lftp (FTPS)
        run: |
          lftp -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PASS }}" ${{ secrets.FTP_HOST }} << 'LFTP_CMDS'
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data yes
          set ftp:ssl-force yes
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 10
          set ftp:use-mdtm off
          mirror --reverse --verbose --overwrite --ignore-time --no-perms --parallel=3 ./ /public_html/ --exclude '.git/' --exclude '.github/' --exclude 'tkvibes-lead-engine/' --exclude 'operations-dashboard/' --exclude 'local-llm/' --exclude 'deliverables/' --exclude 'memory/' --exclude '.venv/' --exclude '.next/' --exclude 'node_modules/' --exclude '__pycache__/' --exclude '*.pyc' --exclude 'README.md' --exclude 'AGENTS.md' --exclude '.gitignore'
          bye
          LFTP_CMDS
