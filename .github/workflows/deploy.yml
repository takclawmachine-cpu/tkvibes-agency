name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Verify build output
        run: |
          echo "Build output contents:"
          ls -la out/
          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html not found — build did not produce expected static export"
            exit 1
          fi

      - name: Compress images for faster FTP transfer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq optipng
          find out/ -name '*.png' -exec optipng -o2 -strip all {} \;
          echo "--- Compressed sizes ---"
          du -sh out/websites/screenshots/ 2>/dev/null || true

      - name: Install lftp
        run: sudo apt-get install -y -qq lftp

      - name: Deploy to Hostinger via lftp (FTPS)
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ftp:ssl-force yes;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            set ftp:rest-list no;
            set ftp:use-mdtm off;
            open -u '${{ secrets.FTP_USER }}','${{ secrets.FTP_PASS }}' ${{ secrets.FTP_HOST }};
            mirror --reverse --verbose --only-newer --transfer-all --no-perms --parallel=3 \
              --exclude-glob=.git* \
              out/ /public_html/;
            bye;
          "
