name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site
        run: |
          test -f index.html || (echo "::error::index.html not found" && exit 1)
          test -f assets/css/styles.css || (echo "::error::styles.css not found" && exit 1)
          echo "Static site files OK"

      - name: Install lftp
        run: sudo apt-get install -y -qq lftp

      - name: Deploy to Hostinger via lftp (FTPS)
        run: |
          lftp -c "
            set ftp:ssl-allow yes
            set ftp:ssl-protect-data yes
            set ftp:ssl-force yes
            set ssl:verify-certificate no
            set ftp:passive-mode yes
            set dns:order inet
            set net:timeout 120
            set net:max-retries 15
            open -u '${{ secrets.FTP_USER }}','${{ secrets.FTP_PASS }}' ${{ secrets.FTP_HOST }};
            mirror --reverse --verbose --overwrite --ignore-time --no-perms --parallel=3 --exclude-glob='.git/' --exclude-glob='.github/' --exclude-glob='scripts/' --exclude-glob='tkvibes-lead-engine/' --exclude-glob='operations-dashboard/' --exclude-glob='local-llm/' --exclude-glob='deliverables/' --exclude-glob='.venv/' --exclude-glob='.next/' --exclude-glob='node_modules/' --exclude-glob='memory/' --exclude-glob='__pycache__/' --exclude-glob='\*.pyc' ./ /public_html/;
            bye;
          "
