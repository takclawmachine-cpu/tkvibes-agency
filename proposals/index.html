<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TKVibes Proposals</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;padding:20px;min-height:100vh}
h1{font-size:1.5rem;margin-bottom:0.5rem;background:linear-gradient(135deg,#8b5cf6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#94a3b8;margin-bottom:1.5rem;font-size:0.9rem}
h2{color:#a78bfa;font-size:1.1rem;margin:1.5rem 0 0.75rem;padding-bottom:0.25rem;border-bottom:1px solid rgba(255,255,255,0.1)}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:1rem;margin-bottom:0.75rem;display:flex;justify-content:space-between;align-items:center}
.card h3{font-size:0.95rem;font-weight:500;color:#e2e8f0;margin-bottom:0.25rem}
.card .meta{font-size:0.8rem;color:#64748b}
.links{display:flex;gap:0.5rem;flex-shrink:0}
.btn{display:inline-block;padding:0.4rem 0.75rem;border-radius:8px;text-decoration:none;font-size:0.8rem;font-weight:500}
.btn-primary{background:#8b5cf6;color:white}
.btn-outline{border:1px solid rgba(255,255,255,0.2);color:#cbd5e1}
.back{display:inline-block;margin-top:2rem;color:#8b5cf6;text-decoration:none;font-size:0.9rem}
</style>
</head>
<body>
<h1>📋 Proposals</h1>
<p class="sub">Sample websites and pitch decks generated by TKVibes Agency</p>
<h2>Sample Websites</h2>
<div id="sites"></div>
<h2>Pitch Decks</h2>
<div id="decks"></div>
<a href="/crm/" class="back">← Back to CRM</a>
<script>
async function load(){
  try{
    const r=await fetch('/crm/debug.php');
    const d=await r.json();
    const leads=d.leads||d;
    const sites=document.getElementById('sites');
    const decks=document.getElementById('decks');
    sites.innerHTML='';decks.innerHTML='';
    leads.forEach(l=>{
      if(!l.business_name||l.business_name==='Test Business')return;
      const n=l.business_name;
      const su=l.sample_site_url;
      const du=l.pitch_deck_url;
      if(su){
        const slug=su.split('/').pop();
        sites.innerHTML+='<div class="card"><div><h3>'+n+'</h3><div class="meta">'+slug+'</div></div><div class="links"><a href="'+su+'" target="_blank" class="btn btn-primary">View</a><a href="'+su+'" download class="btn btn-outline">Download</a></div></div>';
      }
      if(du){
        const slug=du.split('/').pop();
        decks.innerHTML+='<div class="card"><div><h3>'+n+'</h3><div class="meta">'+slug+'</div></div><div class="links"><a href="'+du+'" target="_blank" class="btn btn-primary">View</a><a href="'+du+'" download class="btn btn-outline">Download</a></div></div>';
      }
    });
  }catch(e){
    document.body.innerHTML+='<p style="color:#ef4444">Error loading proposals</p>';
  }
}
load();
</script>
</body>
</html>
