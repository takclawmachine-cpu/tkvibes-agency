run:
  # Global compliance: enable per jurisdiction as you expand
  # India: DPDP Act 2023 (personal data minimization)
  # EU/UK: GDPR (legitimate interest basis for B2B marketing)
  # US:   CCPA/CPRA + CAN-SPAM (unsubscribe honor)
  # UAE:  PDPL
  collect_personal_data: false      # Keep off unless you have a legal basis
  cache_stale_days: 30              # Places policy-aligned refresh window
  max_leads_per_run: 40             # 20 per employee (Jashmit=India, Tishya=Canada)

sources:
  google_places: true
  indiamart: false                  # opt-in; review ToS before enabling
  justdial: false

targets:
  # Pan-India + Canada targeting.
  # Agency is Delhi-based, but Canada expansion covers GTA, BC, Alberta.
  # Cost note: leads pulled = cities x categories x max_results_per_query,
  # and every Places call is billable. Trim this list, not the categories,
  # if spend gets high. max_leads_per_run caps what is actually kept.
  cities:
    # ── India: Delhi NCR (home turf — highest priority) ──
    - "Delhi"
    - "New Delhi"
    - "Gurgaon"
    - "Noida"
    - "Ghaziabad"
    - "Faridabad"
    # ── India: Tier-1 metros ──
    - "Mumbai"
    - "Bengaluru"
    - "Hyderabad"
    - "Chennai"
    - "Kolkata"
    - "Pune"
    - "Ahmedabad"
    # ── India: Tier-2 (less agency competition, cheaper to win) ──
    - "Jaipur"
    - "Lucknow"
    - "Chandigarh"
    - "Indore"
    - "Bhopal"
    - "Nagpur"
    - "Surat"
    - "Kochi"
    - "Coimbatore"
    - "Visakhapatnam"
    - "Bhubaneswar"
    - "Dehradun"
    # ── Canada: Ontario GTA ──
    - "Toronto"
    - "Mississauga"
    - "Brampton"
    - "Markham"
    - "Vaughan"
    - "Richmond Hill"
    - "Oakville"
    - "Burlington"
    - "Milton"
    # ── Canada: Ontario rest ──
    - "Ottawa"
    - "Hamilton"
    - "Kitchener"
    - "Waterloo"
    - "London"
    - "Windsor"
    # ── Canada: British Columbia ──
    - "Vancouver"
    - "Surrey"
    - "Burnaby"
    - "Richmond"
    - "Coquitlam"
    # ── Canada: Alberta ──
    - "Calgary"
    - "Edmonton"
    # ── Canada: Quebec ──
    - "Montreal"
    - "Laval"
    # ── Canada: other provinces ──
    - "Winnipeg"
    - "Saskatoon"
    - "Regina"
    - "Halifax"
  # ── EXCLUDED categories (not targeted) ──
  # shopify or WooCommerce shops, SaaS startups, local service businesses
  # (except lawyers), real estate, coaches/consultants with funnels,
  # massage centres, med spas, home services, clinics (chiropractors,
  # physios, small medical practices), lawyers (except law firms)
  excluded_categories:
    # Explicitly excluded (too noisy or low-fit)
    []
  categories:
    # Law firms (legal services — high-fit target)
    - "law firm"
    - "lawyer"
    - "advocate"
    # Medical specialists (chiropractors, physios, small practices — high-fit)
    - "chiropractor"
    - "physical therapist"
    - "physiotherapy clinic"
    - "orthopedic clinic"
    - "cardiology clinic"
    - "pediatric clinic"
    - "pediatrician"
    - "dermatologist"
    - "eye clinic"
    - "ophthalmologist"
    - "cosmetic clinic"
    - "skin clinic"
    - "fertility clinic"
    # Veterinary & pet care (high-fit)
    - "veterinary clinic"
    - "pet clinic"
    - "veterinarian"
    # High-value service businesses (secondary)
    - "interior designer"
    - "architecture firm"
    - "chartered accountant"
    - "financial advisor"
    - "insurance agency"
    - "luxury salon"
    - "spa"
    - "jewelry store"
    - "boutique"
  max_results_per_query: 60

scoring:
  hot_threshold: 70
  warm_threshold: 45
  # Removed: dental, real estate, shopify, saas, massage, med spa, home services, coaches, consultants
  high_fit_categories:
    - "lawyer"
    - "law firm"
    - "advocate"
    - "attorney"
    - "solicitor"
    - "chiropractor"
    - "physical therapist"
    - "physiotherapy"
    - "physiotherapist"
    - "orthopedic"
    - "cardiology"
    - "pediatric"
    - "pediatrician"
    - "dermatologist"
    - "eye clinic"
    - "ophthalmologist"
    - "cosmetic"
    - "dermatology"
    - "skin clinic"
    - "fertility"
    - "veterinary"
    - "veterinarian"
    - "vet"
    - "pet clinic"
    - "interior designer"
