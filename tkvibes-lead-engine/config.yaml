  # Target distribution: aim for equal representation across these groups
  category_groups:
    legal:
      - "law firm"
      - "lawyer"
      - "advocate"
    medical:
      - "chiropractor"
      - "physical therapist"
      - "physiotherapy clinic"
      - "orthopedic clinic"
      - "cardiology clinic"
      - "pediatric clinic"
      - "pediatrician"
      - "dermatologist"
      - "eye clinic"
      - "ophthalmologist"
      - "cosmetic clinic"
      - "skin clinic"
      - "fertility clinic"
    veterinary:
      - "veterinary clinic"
      - "pet clinic"
      - "veterinarian"
    services:
      - "interior designer"
      - "architecture firm"
      - "chartered accountant"
      - "financial advisor"
      - "insurance agency"
      - "luxury salon"
      - "spa"
      - "jewelry store"
      - "boutique"

rate_limits:
  per_domain_delay_seconds: 4
  max_retries: 3

# ── Email discovery ──
email_finder:
  enabled: true
  # Only crawl sites for leads at/above this tier (saves time on cold leads)
  min_tier: "WARM"
  per_site_delay_seconds: 0.8
  max_pages_per_site: 6
  timeout_seconds: 12
  # Fallback: search the open web for leads with no website.
  # NOTE: free search engines (DuckDuckGo/Bing) actively block scraping and
  # serve CAPTCHAs, so this yields very little. Leave off unless you plug in
  # a paid SERP API key (see README "Email coverage").
  search_fallback: false
  search_delay_seconds: 3.0

sheets:
  worksheet_name: "Leads"

# ── Downstream handoff config ──
handoff:
  # JSON export path — the email agent reads this file after each run
  export_json: "data/leads_export.json"
  # Only export leads at or above this tier
  min_tier: "WARM"   # HOT, WARM, or COLD

# ── CRM integration ──
crm:
  # Webhook endpoint for pushing leads to the employee CRM dashboard
  api_url: "https://tkvibes.in/crm"   # e.g. "https://tkvibes.in/crm"
  api_key: "10a76f01219e8fd7b1fec2c5256c6a39"   # shared secret — set in CRM admin panel
  # Fallback employee mapping (used when CRM API is unreachable).
  # Each entry: {name: "Employee Name", regions: ["Delhi NCR", "Mumbai Metro"]}
  employees: []
  # Country-level assignment (highest priority — wins over region mapping).
  # Every lead whose country matches gets assigned to this employee.
  country_assignments:
    "India": "Jashmit Bhalla"
    "Canada": "Tishya Kane"