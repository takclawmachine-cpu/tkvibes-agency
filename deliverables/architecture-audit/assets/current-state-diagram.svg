<!--
  TKVibes AI CRM — Complete Architecture Diagrams
  Contains: Current State, Target State, Data Flow, Agent Responsibility Map,
            Deployment Conflict, Security Posture
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1600" width="100%" height="auto" font-family="system-ui, sans-serif">
  <style>
    :root{
      --bg:#0f172a;--card:#1e293b;--border:#334159;--text:#e2e8f0;--muted:#94a3b8;
      --accent:#38bdf8;--danger:#ef4444;--success:#22c55e;--warning:#f59e0b;
      --critical:bg(#ef4444);--info:#60a5fa;
    }
    *{stroke-linecap:round;stroke-linejoin:round}
    .bg{fill:#0a0a1a}
    .card{fill:#1e293b;stroke:#334159;stroke-width:1}
    .header{fill:#1e3a5c;stroke:#475569;stroke-width:2}
    .subheader{fill:#334159;stroke:#475569;stroke-width:1}
    .title{fill:#f8fafc;font-size:22;font-weight:700}
    .subtitle{fill:#cbd5e1;font-size:14;font-weight:500}
    .label{fill:#e2e8f0;font-size:13;font-weight:500}
    .muted{fill:#94a3b8;font-size:12}
    .accent{fill:#38bdf8}
    .danger{fill:#ef4444}
    .success{fill:#22c55e}
    .warning{fill:#f59e0b}
    .critical{fill:#ef4444}
    .info{fill:#60a5fa}
    text{font-family:'Segoe UI',system-ui,sans-serif}
    .flow{stroke:#38bdf8;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .flow-err{stroke:#ef4444;stroke-width:2;stroke-dasharray:6,4;fill:none;marker-end:url(#arrow-err)}
    .flow-ok{stroke:#22c55e;stroke-width:2;fill:none;marker-end:url(#arrow-ok)}
    .flow-warn{stroke:#f59e0b;stroke-width:2;stroke-dasharray:4,4;fill:none;marker-end:url(#arrow-warn)}
    .conflict{stroke:#ef4444;stroke-width:3;stroke-dasharray:10,6;fill:none;marker-end:url(#arrow-err)}
    .issue-box{fill:#7f1d1d;stroke:#ef4444;stroke-width:1}
    .fixed-box{fill:#145a1f;stroke:#22c55e;stroke-width:1}
    .open-box{fill:#78350f;stroke:#f59e0b;stroke-width:1}
    .ok-box{fill:#064e3b;stroke:#22c55e;stroke-width:1}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-err" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- ===== SECTION 1: CURRENT STATE ARCHITECTURE ===== -->
  <rect x="0" y="0" width="1400" height="560" class="bg"/>
  <text x="700" y="35" text-anchor="middle" class="title">TKVibes AI CRM — Current State Architecture</text>
  <text x="700" y="55" text-anchor="middle" class="muted" font-size="14">48 issues | 3 data stores | 5 deployment paths | No source of truth</text>

  <!-- Lead Engine -->
  <rect x="60" y="80" width="300" height="460" class="header" rx="12"/>
  <text x="210" y="105" text-anchor="middle" font-size="16" fill="#f0f9ff">LEAD ENGINE (Python 3.11)</text>

  <rect x="80" y="120" width="260" height="48" class="subheader" rx="6"/>
  <text x="210" y="150" text-anchor="middle" class="label">Google Places API</text>
  <text x="210" y="165" text-anchor="middle" class="muted" font-size="11">places.googleapis.com/v1:searchText</text>

  <rect x="80" y="173" width="260" height="55" class="subheader" rx="6"/>
  <text x="210" y="200" text-anchor="middle" class="label">run.py Pipeline</text>
  <text x="210" y="215" text-anchor="middle" class="muted" font-size="11">discover → enrich → score → dedupe → assign</text>
  <text x="210" y="230" text-anchor="middle" class="muted" font-size="11">print() used, not structured logging</text>

  <rect x="80" y="233" width="260" height="42" class="subheader" rx="6"/>
  <text x="210" y="256" text-anchor="middle" class="label">generate_proposals.py</text>
  <text x="210" y="270" text-anchor="middle" class="muted" font-size="11">template-v2.html + AI spec via OpenRouter</text>

  <rect x="80" y="278" width="260" height="42" class="subheader" rx="6"/>
  <text x="210" y="301" text-anchor="middle" class="label">git_publish.py</text>
  <text x="210" y="315" text-anchor="middle" class="muted" font-size="11">copy → git push → build GitHub raw URLs</text>

  <rect x="80" y="323" width="260" height="42" class="subheader" rx="6"/>
  <text x="210" y="346" text-anchor="middle" class="label">push_leads() → sync.php</text>
  <text x="210" y="360" text-anchor="middle" class="muted" font-size="11">per-lead HTTP POST, no batching</text>

  <rect x="80" y="368" width="260" height="42" class="subheader" rx="6"/>
  <text x="210" y="391" text-anchor="middle" class="label">push_proposals()</text>
  <text x="210" y="405" text-anchor="middle" class="muted" font-size="11">POST HTML to proposals.php (stores in DB)</text>

  <rect x="80" y="413" width="260" height="42" class="subheader" rx="6"/>
  <text x="210" y="436" text-anchor="middle" class="label">SheetWriter (gspread)</text>
  <text x="210" y="450" text-anchor="middle" class="muted" font-size="11">upsert to Sheets (per-run, not transactional)</text>
  <text x="210" y="464" text-anchor="middle" class="muted" font-size="11">H2: no row-level locking</text>

  <!-- Data Stores -->
  <rect x="420" y="80" width="260" height="460" class="header" rx="12"/>
  <text x="550" y="105" text-anchor="middle" font-size="16" fill="#f0f9ff">THREE DATA STORES</text>
  <text x="550" y="125" text-anchor="middle" class="muted" font-size="12">No single source of truth</text>

  <!-- SQLite -->
  <rect x="440" y="145" width="100" height="95" class="card" rx="6"/>
  <rect x="440" y="145" width="100" height="20" class="ok-box" rx="6 6 0 0"/>
  <text x="490" y="160" text-anchor="middle" class="label" font-size="13">SQLite/MySQL</text>
  <text x="490" y="175" text-anchor="middle" class="muted" font-size="11">47-col leads table